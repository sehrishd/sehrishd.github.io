<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Joystick Spaceship Game</title>

    <!-- Load p5.js and p5.webserial libraries  -->
    <!-- p5.js library lets us draw the game, canvas, shapes, animations.
    p5.webserial.js lets the webpage communicate with the Arduino. -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <script src="https://unpkg.com/@gohai/p5.webserial@^1/libraries/p5.webserial.js"></script>

    <style>
    /* Some styling to remove the margins so the page touches
    the whole window area */
      body {
        margin: 0;
        background-color: #ffffff;
        color: white;
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      /* Style the page title */
      h1 {
        margin-top: 10px;
        color: rgb(0, 0, 0);
      }

      /* button styling to make it look nicer than the default one */
      button {
        font-size: 16px;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background-color: #333;
        color: white;
        transition: background-color 0.2s;
      }

      /* Change the button background color When mouse hovers over button */
      button:hover {
        background-color: #555;
      }
    </style>
  </head>

  <body>
    <h1>Joystick Spaceship Game</h1>

    <!-- Load JavaScript game logic -->
    <script src="spaceship.js"></script>
  </body>
</html>
