<!DOCTYPE html>

      <div class="image-container" style="margin: 40px 0; width: 100%; display: block;">
        <img src="steeply_slide.png" alt="Steeply Project Image" class="project-image" style="width: 100%; max-width: calc(100vw - 80px); height: auto; border-radius: 8px; display: block; margin: 0 auto;" />
      </div>
    </div>

    <style>
